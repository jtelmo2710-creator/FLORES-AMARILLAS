<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Un ramo de girasoles para ti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Pantalla de inicio: el toque del usuario permite activar la música -->
  <button class="intro" id="intro" type="button" aria-label="Abrir la tarjeta">
    <img class="intro__flor" src="assets/img/girasol.png" alt="">
    <span class="intro__texto">Toca para abrir</span>
    <span class="intro__pista">con sonido</span>
  </button>

  <main class="card">
    <header class="message" id="message">
      <h1 id="title"></h1>
      <p id="text"></p>
    </header>

    <!-- El ramo se construye desde assets/js/script.js -->
    <div class="bouquet" id="bouquet" role="img" aria-label="Un ramo de girasoles que va creciendo"></div>

    <button class="replay" id="replay" type="button" aria-label="Ver de nuevo" title="Ver de nuevo">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
        <path d="M20 4v5h-5"/>
      </svg>
    </button>

    <button class="sound is-off" id="sound" type="button" aria-pressed="false" aria-label="Activar música" title="Música">
      <svg class="sound__on" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>
        <path d="M15.5 9a4 4 0 0 1 0 6"/>
        <path d="M18 6.5a8 8 0 0 1 0 11"/>
      </svg>
      <svg class="sound__off" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>
        <path d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
    </button>
  </main>

  <script src="assets/js/musica.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
